<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The ServiceLink Problem</title>
<style>
  :root {
    --bg: #ece7df; --surface: #fffdfa; --surface-alt: #f2eee7;
    --text: #1b1a17; --muted: #6e6960; --border: #ded7cb;
    --accent: #1f4d8f; --accent-soft: #e9eefa;
    --correct: #1f7a4d; --correct-soft: #e5f3ea;
    --wrong: #ab2f22; --wrong-soft: #fae9e6;
    --gold: #8f6408; --gold-soft: #f9f0da;
    --shadow: 0 1px 2px rgba(25,20,10,.05), 0 10px 30px rgba(25,20,10,.09);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* scene palette */
    --wall: #d8cfc0; --wall2: #c9bfae; --floor: #a8927a; --floor2: #9a836b;
    --furn: #8a6f52; --furn2: #6f573e; --metal: #b9bcc2; --glass: #cfe3ef;
    --sky: #bcd8e8; --screen: #2f4858; --paper: #f7f4ec;
    --skin1: #c8956a; --skin2: #8d5d3b; --skin3: #e0b48c;
    --cloth1: #3d5a80; --cloth2: #7d4e57; --cloth3: #4a6b52; --cloth4: #5b5570;
    --hair1: #2e2620; --hair2: #56483c; --hair3: #8a8a88;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --surface: #1a1d22; --surface-alt: #202429;
      --text: #e9e6e1; --muted: #9b968d; --border: #2c3039;
      --accent: #7ba4ea; --accent-soft: #1b2533;
      --correct: #4ec98a; --correct-soft: #142620;
      --wrong: #f2857c; --wrong-soft: #2a1a18;
      --gold: #e0b34a; --gold-soft: #272115;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
      --wall: #2f3742; --wall2: #262d36; --floor: #3a3129; --floor2: #2e2721;
      --furn: #4a3a2a; --furn2: #372a1e; --metal: #565c66; --glass: #2b4250;
      --sky: #22394a; --screen: #1a2a36; --paper: #cfc9bd;
      --skin1: #a87a52; --skin2: #74492c; --skin3: #bb8f68;
      --cloth1: #35506f; --cloth2: #6a414a; --cloth3: #3f5c46; --cloth4: #4d4860;
      --hair1: #1d1915; --hair2: #453a30; --hair3: #6f6f6d;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 1.5rem 1rem 3rem; background: var(--bg); color: var(--text);
    font-family: var(--sans); line-height: 1.5;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 48rem; }
  a { color: var(--accent); }
  p { margin: 0 0 1rem; }

  .frame {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
  }

  /* ── top bar ─────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .7rem 1rem; border-bottom: 1px solid var(--border);
    background: var(--surface-alt); font-size: .72rem; flex-wrap: wrap;
  }
  .chap { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--muted); }
  .chap b { color: var(--accent); }
  .chap .place { text-transform: none; letter-spacing: .02em; font-weight: 400; font-style: italic; }
  .stats { display: flex; gap: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); }
  .stats .hot { color: var(--gold); font-weight: 700; }

  /* ── stage ───────────────────────────────────────── */
  .stage { position: relative; background: var(--wall2); line-height: 0; }
  .stage svg { width: 100%; height: auto; display: block; }
  .stage.enter { animation: fadeScene .5s ease both; }
  @keyframes fadeScene { from { opacity: 0; transform: scale(1.015); } to { opacity: 1; transform: none; } }

  .hot {
    position: absolute; transform: translate(-50%, -50%);
    width: 2.3rem; height: 2.3rem; border-radius: 50%;
    border: 0; background: transparent; cursor: pointer; padding: 0;
    display: grid; place-items: center;
  }
  .hot::before {
    content: ""; width: .85rem; height: .85rem; border-radius: 50%;
    background: rgba(255,255,255,.92); box-shadow: 0 0 0 2px rgba(31,77,143,.75), 0 2px 6px rgba(0,0,0,.35);
    transition: transform .18s;
  }
  .hot::after {
    content: ""; position: absolute; width: 1.8rem; height: 1.8rem; border-radius: 50%;
    border: 2px solid rgba(31,77,143,.55); animation: ping 2.4s ease-out infinite;
  }
  .hot.done::before { background: rgba(255,255,255,.45); box-shadow: 0 0 0 2px rgba(120,120,120,.6); }
  .hot.done::after { display: none; }
  .hot.key::before { background: var(--gold); box-shadow: 0 0 0 2px rgba(143,100,8,.85), 0 2px 8px rgba(0,0,0,.4); }
  .hot.key::after { border-color: rgba(143,100,8,.6); }
  .hot:hover::before, .hot:focus-visible::before { transform: scale(1.4); }
  .hot:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @keyframes ping {
    0% { transform: scale(.6); opacity: .9; }
    70% { transform: scale(1.35); opacity: 0; }
    100% { opacity: 0; }
  }
  .hot .tip {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: rgba(20,18,15,.92); color: #fff; font-family: var(--sans);
    font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 600;
    padding: .25rem .5rem; border-radius: 5px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .15s; line-height: 1.4;
  }
  .hot:hover .tip, .hot:focus-visible .tip { opacity: 1; }
  .locknote { font-size: .6rem; opacity: .75; display: block; text-transform: none; letter-spacing: 0; }

  /* ── narration ───────────────────────────────────── */
  .narr {
    padding: 1.1rem 1.2rem; border-top: 1px solid var(--border);
    font-family: var(--serif); font-size: 1.02rem; line-height: 1.6; min-height: 5.5rem;
  }
  .narr p { margin: 0 0 .7rem; }
  .narr p:last-child { margin: 0; }
  .narr .who {
    display: block; font-family: var(--sans); font-size: .66rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin-bottom: .3rem;
  }
  .narr .line { animation: slideIn .3s ease both; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .more { font-family: var(--sans); font-size: .7rem; color: var(--muted); margin-top: .6rem; }
  .more::after { content: " ▸"; animation: blink 1.3s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .gain {
    display: inline-flex; align-items: center; gap: .4rem;
    background: var(--gold-soft); border: 1px solid var(--gold); color: var(--gold);
    font-family: var(--sans); font-size: .72rem; font-weight: 700;
    padding: .3rem .6rem; border-radius: 6px; margin-top: .5rem;
    animation: badgeIn .45s cubic-bezier(.2,.9,.3,1.3) both;
  }
  @keyframes badgeIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

  /* ── evidence tray ───────────────────────────────── */
  .tray {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    padding: .7rem 1rem; border-top: 1px solid var(--border); background: var(--surface-alt);
  }
  .tray-label {
    font-size: .64rem; text-transform: uppercase; letter-spacing: .12em;
    font-weight: 700; color: var(--muted); margin-right: .2rem;
  }
  .item {
    width: 2.1rem; height: 2.1rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); font-size: .95rem; cursor: pointer; padding: 0;
    display: grid; place-items: center; transition: transform .15s, border-color .15s;
  }
  .item:hover, .item:focus-visible { transform: translateY(-2px); border-color: var(--gold); }
  .item.fresh { animation: badgeIn .5s cubic-bezier(.2,.9,.3,1.3) both; }
  .slot { width: 2.1rem; height: 2.1rem; border-radius: 8px; border: 1px dashed var(--border); opacity: .55; }
  .tray .count { margin-left: auto; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ── overlay panels ──────────────────────────────── */
  .veil {
    position: absolute; inset: 0; background: rgba(15,13,10,.72);
    display: grid; place-items: center; padding: 1rem; animation: fade .25s ease both;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    background: var(--surface); border-radius: 12px; padding: 1.3rem;
    max-width: 30rem; width: 100%; max-height: 100%; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.4); animation: rise .3s cubic-bezier(.2,.9,.3,1.1) both;
    line-height: 1.5;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .panel h3 { font-family: var(--serif); font-size: 1.15rem; margin: 0 0 .6rem; }
  .panel .kicker {
    font-size: .64rem; text-transform: uppercase; letter-spacing: .12em;
    font-weight: 700; color: var(--muted); margin-bottom: .5rem;
  }
  .panel p { font-size: .92rem; }

  .opts { display: flex; flex-direction: column; gap: .5rem; margin: 0 0 .3rem; }
  .opt {
    display: flex; gap: .65rem; align-items: flex-start; width: 100%; text-align: left;
    font: inherit; font-size: .9rem; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 9px; padding: .7rem .8rem; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: not-allowed; opacity: .55; }
  .opt .key {
    flex: 0 0 auto; width: 1.35rem; height: 1.35rem; border-radius: 5px; background: var(--surface-alt);
    color: var(--muted); font-size: .72rem; font-weight: 700; display: grid; place-items: center;
  }
  .opt.correct { border-color: var(--correct); background: var(--correct-soft); }
  .opt.correct .key { background: var(--correct); color: #fff; }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
  .opt.wrong .key { background: var(--wrong); color: #fff; }
  .opt.faded { opacity: .4; }
  .opt .lock { font-size: .68rem; color: var(--muted); display: block; margin-top: .2rem; font-style: italic; }

  .outcome {
    border-left: 3px solid var(--correct); background: var(--correct-soft);
    padding: .85rem 1rem; border-radius: 0 9px 9px 0; margin-bottom: .7rem;
  }
  .outcome.bad { border-left-color: var(--wrong); background: var(--wrong-soft); }
  .outcome .verdict {
    font-size: .64rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--correct); margin-bottom: .3rem;
  }
  .outcome.bad .verdict { color: var(--wrong); }
  .outcome p { font-family: var(--serif); font-size: .97rem; margin: 0; }
  .why { background: var(--surface-alt); border-radius: 9px; padding: .85rem 1rem; margin-bottom: .9rem; }
  .why .lbl {
    font-size: .64rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: .35rem;
  }
  .why p { font-size: .88rem; line-height: 1.6; margin: 0 0 .6rem; }
  .why .src { font-size: .74rem; color: var(--muted); margin: 0; }

  .btn {
    font: inherit; font-weight: 600; font-size: .9rem; background: var(--accent); color: #fff;
    border: 1px solid var(--accent); border-radius: 9px; padding: .62rem 1.2rem;
    cursor: pointer; transition: opacity .15s; text-decoration: none; display: inline-block;
  }
  @media (prefers-color-scheme: dark) { .btn { color: #10141b; } }
  .btn:hover { opacity: .88; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.wide { width: 100%; }

  /* ── title + ending ──────────────────────────────── */
  .title { padding: 2.2rem 1.6rem 1.8rem; text-align: center; }
  .title h1 { font-family: var(--serif); font-size: 2.2rem; line-height: 1.12; margin: 0 0 .2rem; letter-spacing: -.015em; }
  .title .sub { font-size: .7rem; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); font-weight: 700; margin-bottom: 1.3rem; }
  .title .prose { font-family: var(--serif); font-size: 1.05rem; line-height: 1.62; max-width: 27rem; margin: 0 auto 1.4rem; text-align: left; }
  .rank-name { font-family: var(--serif); font-size: 1.8rem; margin: .2rem 0 .6rem; }
  .epilogue { font-family: var(--serif); font-size: 1.02rem; line-height: 1.6; color: var(--muted); max-width: 26rem; margin: 0 auto 1.3rem; }
  .big { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .big span { font-size: .85rem; font-weight: 400; color: var(--muted); }
  .tallies { display: flex; justify-content: center; gap: 1.6rem; margin-top: .9rem; flex-wrap: wrap; }
  .tally { font-size: .74rem; color: var(--muted); }
  .tally b { display: block; font-size: 1.05rem; color: var(--text); font-variant-numeric: tabular-nums; }
  .best { font-size: .76rem; color: var(--muted); text-align: center; margin: 1rem 0 0; }

  .endwrap { padding: 1.6rem; }
  .eyebrow { font-size: .64rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--muted); margin: 0 0 .7rem; }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; margin-bottom: 1.4rem; }
  @media (max-width: 34rem) { .badges { grid-template-columns: repeat(2, 1fr); } }
  .badge {
    border: 1px solid var(--border); border-radius: 10px; padding: .65rem .55rem;
    text-align: center; opacity: .35; transition: opacity .4s, border-color .4s, background .4s;
  }
  .badge .ico { font-size: 1.15rem; }
  .badge .nm { font-size: .7rem; font-weight: 700; margin-top: .15rem; line-height: 1.25; }
  .badge .ds { font-size: .64rem; color: var(--muted); margin-top: .12rem; line-height: 1.3; }
  .badge.earned { opacity: 1; border-color: var(--gold); background: var(--gold-soft); animation: badgeIn .5s cubic-bezier(.2,.9,.3,1.3) both; }
  .badge.earned .nm { color: var(--gold); }
  .nudge { background: var(--accent-soft); border-radius: 10px; padding: .9rem 1rem; font-size: .87rem; line-height: 1.55; margin-bottom: 1.3rem; }
  .review { border-top: 1px solid var(--border); padding-top: 1rem; }
  .row { padding: .8rem 0; border-bottom: 1px solid var(--border); font-size: .86rem; }
  .row:last-child { border-bottom: 0; }
  .row .q { font-weight: 600; margin-bottom: .3rem; }
  .row .a { color: var(--muted); font-size: .78rem; line-height: 1.5; }
  .row .a b { color: var(--text); font-weight: 600; }
  .mark { font-weight: 700; margin-right: .3rem; }
  .mark.ok { color: var(--correct); }
  .mark.no { color: var(--wrong); }
  .actions { display: flex; gap: .6rem; justify-content: center; margin-top: 1.4rem; flex-wrap: wrap; }
  footer { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 1.1rem; }
  .hint { font-size: .72rem; color: var(--muted); margin: .9rem 0 0; }

  /* ── scene art classes ───────────────────────────── */
  .s-wall { fill: var(--wall); } .s-wall2 { fill: var(--wall2); }
  .s-floor { fill: var(--floor); } .s-floor2 { fill: var(--floor2); }
  .s-furn { fill: var(--furn); } .s-furn2 { fill: var(--furn2); }
  .s-metal { fill: var(--metal); } .s-glass { fill: var(--glass); }
  .s-sky { fill: var(--sky); } .s-screen { fill: var(--screen); }
  .s-paper { fill: var(--paper); } .s-accent { fill: var(--accent); }
  .s-gold { fill: var(--gold); } .s-red { fill: var(--wrong); } .s-green { fill: var(--correct); }
  .s-skin1 { fill: var(--skin1); } .s-skin2 { fill: var(--skin2); } .s-skin3 { fill: var(--skin3); }
  .s-c1 { fill: var(--cloth1); } .s-c2 { fill: var(--cloth2); } .s-c3 { fill: var(--cloth3); } .s-c4 { fill: var(--cloth4); }
  .s-h1 { fill: var(--hair1); } .s-h2 { fill: var(--hair2); } .s-h3 { fill: var(--hair3); }
  .s-shadow { fill: rgba(0,0,0,.13); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   THE SERVICELINK PROBLEM — a point-and-click product thinking game
   Built on Singapore's Institute of Digital Government
   "Product Thinking" pathway (AI Build 301).
   ═══════════════════════════════════════════════════════════════════ */

var GUIDE = "https://www.idg.gov.sg/guides-and-resources/";

/* ── scene art primitives ─────────────────────────────────────────
   Everything is drawn from a handful of shapes on an 800x400 stage.
   Colours come from CSS classes so both themes work for free.       */

function room(opt) {
  opt = opt || {};
  var wallH = opt.wallH || 300;
  return '<rect class="s-wall" x="0" y="0" width="800" height="' + wallH + '"/>' +
         '<rect class="s-wall2" x="0" y="0" width="800" height="46"/>' +
         '<rect class="s-floor" x="0" y="' + wallH + '" width="800" height="' + (400 - wallH) + '"/>' +
         '<rect class="s-floor2" x="0" y="' + wallH + '" width="800" height="7"/>';
}

function win(x, y, w, h) {
  return '<rect class="s-metal" x="' + (x - 4) + '" y="' + (y - 4) + '" width="' + (w + 8) + '" height="' + (h + 8) + '" rx="3"/>' +
         '<rect class="s-sky" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>' +
         '<rect class="s-metal" x="' + (x + w / 2 - 2) + '" y="' + y + '" width="4" height="' + h + '"/>' +
         '<rect class="s-metal" x="' + x + '" y="' + (y + h / 2 - 2) + '" width="' + w + '" height="4"/>';
}

function nightWin(x, y, w, h) {
  return '<rect class="s-metal" x="' + (x - 4) + '" y="' + (y - 4) + '" width="' + (w + 8) + '" height="' + (h + 8) + '" rx="3"/>' +
         '<rect style="fill:#1b2536" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>' +
         '<g style="fill:#f0c86a">' +
           '<rect x="' + (x + 12) + '" y="' + (y + 22) + '" width="7" height="9"/>' +
           '<rect x="' + (x + 30) + '" y="' + (y + 40) + '" width="7" height="9"/>' +
           '<rect x="' + (x + 52) + '" y="' + (y + 18) + '" width="7" height="9"/>' +
           '<rect x="' + (x + 22) + '" y="' + (y + 62) + '" width="7" height="9"/>' +
           '<rect x="' + (x + 64) + '" y="' + (y + 54) + '" width="7" height="9"/>' +
         '</g>' +
         '<rect class="s-metal" x="' + (x + w / 2 - 2) + '" y="' + y + '" width="4" height="' + h + '"/>';
}

function desk(x, y, w, h) {
  h = h || 14;
  return '<rect class="s-furn" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3"/>' +
         '<rect class="s-furn2" x="' + (x + 10) + '" y="' + (y + h) + '" width="10" height="' + (400 - y - h) + '"/>' +
         '<rect class="s-furn2" x="' + (x + w - 20) + '" y="' + (y + h) + '" width="10" height="' + (400 - y - h) + '"/>';
}

function slab(x, y, w, h, cls) {
  return '<rect class="' + (cls || 's-furn') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="4"/>';
}

function monitor(x, y, w, h, on) {
  return '<rect class="s-metal" x="' + (x - 3) + '" y="' + (y - 3) + '" width="' + (w + 6) + '" height="' + (h + 6) + '" rx="4"/>' +
         '<rect class="' + (on ? 's-screen' : 's-metal') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>' +
         (on || '') +
         '<rect class="s-metal" x="' + (x + w / 2 - 14) + '" y="' + (y + h + 3) + '" width="28" height="7" rx="2"/>';
}

function screenLines(x, y, w, n, cls) {
  var out = '', i;
  for (i = 0; i < n; i++) {
    out += '<rect class="' + (cls || 's-glass') + '" x="' + (x + 8) + '" y="' + (y + 10 + i * 11) + '" width="' + (w - 16 - (i % 3) * 18) + '" height="4" rx="2" opacity="' + (0.85 - i * 0.08) + '"/>';
  }
  return out;
}

function person(x, ground, o) {
  o = o || {};
  var s = o.s || 1, hr = 15 * s, bw = 46 * s, total = 122 * s;
  var top = ground - total, shoulder = top + hr * 2 + 5 * s;
  var g = '<g>';
  g += '<ellipse class="s-shadow" cx="' + x + '" cy="' + (ground + 2) + '" rx="' + (bw * 0.6) + '" ry="' + (6 * s) + '"/>';

var TOTAL = DECISIONS.length;
var EVIDENCE_TOTAL = Object.keys(EVIDENCE).length;
var BASE = 100;
var FIND = 25;
var BEST_KEY = "servicelink-best-v3";

/* ═══════════════════════════════════════════════════════════════════
   ENGINE
   ═══════════════════════════════════════════════════════════════════ */

var app = document.getElementById("app");
var state;

function multiplier(streak) {
  if (streak >= 4) return 2.0;
  if (streak === 3) return 1.5;
  if (streak === 2) return 1.2;
  return 1.0;
}
function streakLabel(streak) {
  if (streak >= 4) return "Shipping";
  if (streak === 3) return "Dialled in";
  if (streak === 2) return "On a roll";
  return "";
}

var MAX_POINTS = (function () {
  var t = 0;
  for (var i = 1; i <= TOTAL; i++) t += Math.round(BASE * multiplier(i));
  return t + EVIDENCE_TOTAL * FIND;
})();

/* Fisher-Yates: the correct answer never sits in a predictable slot. */
function shuffle(n) {
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (j = a.length - 1; j > 0; j--) {
    i = Math.floor(Math.random() * (j + 1));
    t = a[j]; a[j] = a[i]; a[i] = t;
  }
  return a;
}

function reset() {
  state = {
    screen: "title", loc: 0, found: {}, evidence: 0,
    points: 0, correct: 0, streak: 0, bestStreak: 0,
    seen: {}, log: [], dialog: null, gained: null,
    decision: null, orders: []
  };
}

function loadBest() {
  try { var r = localStorage.getItem(BEST_KEY); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function saveBest(run) {
  try {
    var prev = loadBest();
    if (!prev || run.points > prev.points) { localStorage.setItem(BEST_KEY, JSON.stringify(run)); return true; }
  } catch (e) { /* blocked storage — the game does not depend on it */ }
  return false;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function reduced() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function countUp(node, to, ms) {
  if (!node) return;
  if (reduced() || to === 0) { node.textContent = to.toLocaleString(); return; }
  var start = performance.now();
  (function step(now) {
    var t = Math.min(1, (now - start) / ms);
    node.textContent = Math.round(to * (1 - Math.pow(1 - t, 3))).toLocaleString();
    if (t < 1) requestAnimationFrame(step);
  })(performance.now());
}

function here() { return LOCATIONS[state.loc]; }
function seenHere() { state.seen[here().id] = state.seen[here().id] || {}; return state.seen[here().id]; }
function unlocked() {
  return here().need.every(function (id) { return state.found[id]; });
}
function missingCount() {
  return here().need.filter(function (id) { return !state.found[id]; }).length;
}

/* ── render ───────────────────────────────────────────────────── */

function render() {
  if (state.screen === "title") return renderTitle();
  if (state.screen === "end") return renderEnd();
  renderPlay();
}

function renderTitle() {
  var best = loadBest();
  app.innerHTML =
    '<div class="frame">' +
      '<div class="stage">' + '<svg viewBox="0 0 800 400" role="img" aria-label="An empty government meeting room">' + artPostmortem() + '</svg></div>' +
      '<div class="title">' +
        '<div class="sub">A product thinking adventure</div>' +
        '<h1>The ServiceLink Problem</h1>' +
        '<div class="prose">' +
          '<p>Six months ago ServiceLink launched. On time. Under budget. A defect rate low enough to be framed on a wall.</p>' +
          '<p>Nobody uses it. This morning it became your problem.</p>' +
          '<p>Search the rooms. Talk to people. Gather evidence — then make eight decisions you cannot take back. The ones who got this wrong in real life were not stupid; they were simply in a hurry.</p>' +
        '</div>' +
        '<button class="btn" id="go">Take the file</button>' +
        (best ? '<p class="best">Best run: <b>' + best.points.toLocaleString() + '</b> pts · ' + best.correct + '/' + TOTAL +
                ' decisions · ' + best.evidence + '/' + EVIDENCE_TOTAL + ' evidence</p>' : '') +
        '<p class="hint">Click the glowing points to look and talk · <b>1</b>–<b>4</b> to decide</p>' +
      '</div>' +
    '</div>' +
    '<footer>Built on the <a href="https://www.idg.gov.sg/product-thinking/">IDG Product Thinking pathway</a></footer>';
  var go = document.getElementById("go");
  go.addEventListener("click", start);
  go.focus();
}

function start() {
  var keep = loadBest();
  reset();
  state.screen = "play";
  state.hadBest = keep;
  state.orders = DECISIONS.map(function (d) { return shuffle(d.options.length); });
  state.dialog = { lines: [{ text: here().intro, raw: true }], idx: 0 };
  render();
}

function renderPlay() {
  var L = here(), ch = CHAPTERS[L.chapter], seen = seenHere();

  var html = '<div class="frame" style="position:relative">' +
    '<div class="topbar">' +
      '<div class="chap"><b>Chapter ' + (L.chapter + 1) + ' · ' + esc(ch.name) + '</b> ' +
        '<span class="place">— ' + esc(L.place) + ', ' + esc(L.time) + '</span></div>' +
      '<div class="stats">' +
        '<span>Evidence <b>' + state.evidence + '/' + EVIDENCE_TOTAL + '</b></span>' +
        '<span><b id="score">' + state.points.toLocaleString() + '</b> pts</span>' +
        (state.streak >= 2 ? '<span class="hot">' + streakLabel(state.streak) + ' ' + multiplier(state.streak).toFixed(1) + '×</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="stage enter" id="stage">' +
      '<svg viewBox="0 0 800 400" role="img" aria-label="' + esc(L.place) + '">' + SCENES[L.id]() + '</svg>';

  L.hotspots.forEach(function (h) {
    var isAct = h.type === "act";
    var done = !isAct && seen[h.id];
    var cls = "hot" + (done ? " done" : "") + (isAct && unlocked() ? " key" : "");
    var note = isAct && !unlocked() ? '<span class="locknote">' + missingCount() + ' more to find</span>' : "";
    html += '<button class="' + cls + '" data-h="' + h.id + '" style="left:' + h.x + '%;top:' + h.y + '%" ' +
            'aria-label="' + esc(h.label) + '"><span class="tip">' + esc(h.label) + note + '</span></button>';
  });
  html += '</div>';

  html += '<div class="narr" id="narr">' + narrHTML() + '</div>';

  html += '<div class="tray"><span class="tray-label">Evidence</span>';
  var keys = Object.keys(EVIDENCE);
  keys.forEach(function (k) {
    if (state.found[k]) {
      html += '<button class="item' + (state.gained === k ? " fresh" : "") + '" data-e="' + k + '" ' +
              'title="' + esc(EVIDENCE[k].name) + '" aria-label="' + esc(EVIDENCE[k].name) + '">' + EVIDENCE[k].ico + '</button>';
    }
  });
  for (var i = state.evidence; i < EVIDENCE_TOTAL; i++) html += '<span class="slot"></span>';
  html += '<span class="count">' + state.evidence + ' / ' + EVIDENCE_TOTAL + '</span></div>';

  html += '</div>';
  app.innerHTML = html;

  document.querySelectorAll(".hot").forEach(function (b) {
    b.addEventListener("click", function () { touch(this.getAttribute("data-h")); });
  });
  document.querySelectorAll(".item").forEach(function (b) {
    b.addEventListener("click", function () { inspect(this.getAttribute("data-e")); });
  });
  var cont = document.getElementById("cont");
  if (cont) { cont.addEventListener("click", advanceDialog); cont.focus(); }
  var act = document.getElementById("actnow");
  if (act) { act.addEventListener("click", openDecision); act.focus(); }

  if (state.decision) drawDecision();
}

function narrHTML() {
  var out = "";
  if (state.dialog) {
    var line = state.dialog.lines[state.dialog.idx];
    out += '<div class="line">' +
      (line.who ? '<span class="who">' + esc(line.who) + '</span>' : "") +
      (line.raw ? line.text : "<p>" + line.text + "</p>") + "</div>";
    if (state.dialog.idx < state.dialog.lines.length - 1) {
      out += '<button class="btn ghost" id="cont" style="padding:.35rem .8rem;font-size:.8rem">Continue</button>';
    }
  }
  if (state.gained) {
    out += '<div class="gain">' + EVIDENCE[state.gained].ico + " Evidence found — " + esc(EVIDENCE[state.gained].name) + " · +" + FIND + "</div>";
  }
  if ((!state.dialog || state.dialog.idx >= state.dialog.lines.length - 1) && unlocked() && !state.decision) {
    var L = here();
    var actHot = L.hotspots.filter(function (h) { return h.type === "act"; })[0];
    out += '<div style="margin-top:.7rem"><button class="btn" id="actnow">' + esc(actHot.label) + ' →</button></div>';
  }
  return out;
}

/* ── interaction ──────────────────────────────────────────────── */

function touch(id) {
  var L = here();
  var h = L.hotspots.filter(function (x) { return x.id === id; })[0];
  if (!h) return;

  if (h.type === "act") {
    if (!unlocked()) {
      state.dialog = { lines: [{ text: "Not yet. You can feel the shape of it, but you could not defend a word of it in that room — " + missingCount() + " thing" + (missingCount() === 1 ? "" : "s") + " here you have not looked at properly." }], idx: 0 };
      state.gained = null;
      return render();
    }
    return openDecision();
  }

  seenHere()[id] = true;
  state.gained = null;
  state.dialog = { lines: h.lines.slice(), idx: 0, gives: h.gives || null };
  if (h.lines.length === 1) finishDialog();
  render();
}

function advanceDialog() {
  if (!state.dialog) return;
  if (state.dialog.idx < state.dialog.lines.length - 1) {
    state.dialog.idx += 1;
    if (state.dialog.idx === state.dialog.lines.length - 1) finishDialog();
  }
  render();
}

function finishDialog() {
  var g = state.dialog && state.dialog.gives;
  if (g && !state.found[g]) {
    state.found[g] = true;
    state.evidence += 1;
    state.points += FIND;
    state.gained = g;
  }
  if (state.dialog) state.dialog.gives = null;
}

function inspect(id) {
  state.gained = null;
  state.dialog = { lines: [{ who: EVIDENCE[id].ico + "  " + EVIDENCE[id].name, text: EVIDENCE[id].text }], idx: 0 };
  render();
}

/* ── decisions ────────────────────────────────────────────────── */

function openDecision() {
  state.decision = { i: state.loc, answered: false };
  render();
}

function drawDecision() {
  var d = DECISIONS[state.decision.i];
  var order = state.orders[state.decision.i];
  var stage = document.getElementById("app").querySelector(".frame");

  var veil = document.createElement("div");
  veil.className = "veil";
  var html = '<div class="panel" role="dialog" aria-modal="true" aria-label="Decision">' +
    '<div class="kicker">Decision ' + (state.decision.i + 1) + ' of ' + TOTAL + '</div>' +
    '<h3>' + esc(d.ask) + '</h3><div class="opts">';
  for (var p = 0; p < order.length; p++) {
    html += '<button class="opt" data-p="' + p + '"><span class="key">' + (p + 1) + '</span>' +
            '<span>' + esc(d.options[order[p]]) + '</span></button>';
  }
  html += '</div><div id="res"></div></div>';
  veil.innerHTML = html;
  stage.appendChild(veil);

  veil.querySelectorAll(".opt").forEach(function (b) {
    b.addEventListener("click", function () { answer(parseInt(this.getAttribute("data-p"), 10)); });
  });
  veil.querySelector(".opt").focus();
  state.veil = veil;
}

function answer(pos) {
  if (state.decision.answered) return;
  state.decision.answered = true;

  var idx = state.decision.i;
  var d = DECISIONS[idx];
  var order = state.orders[idx];
  var picked = order[pos];
  var right = picked === d.answer;
  var gained = 0;

  if (right) {
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    gained = Math.round(BASE * multiplier(state.streak));
    state.points += gained;
    state.correct += 1;
  } else {
    state.streak = 0;
  }
  state.log.push({ i: idx, picked: picked, right: right });

  var btns = state.veil.querySelectorAll(".opt");
  for (var b = 0; b < btns.length; b++) {
    btns[b].disabled = true;
    if (order[b] === d.answer) btns[b].classList.add("correct");
    else if (b === pos) btns[b].classList.add("wrong");
    else btns[b].classList.add("faded");
  }

  /* Right answer, but did you do the legwork to back it up? */
  var thin = right && d.needFor && !state.found[d.needFor];
  var story = right ? (thin ? d.winAlt : d.win) : d.lose;
  var last = idx === TOTAL - 1;

  state.veil.querySelector("#res").innerHTML =
    '<div class="outcome' + (right ? "" : " bad") + '" id="out" tabindex="-1">' +
      '<div class="verdict">What happens next' +
        (gained ? ' · +' + gained + (state.streak >= 2 ? " · " + multiplier(state.streak).toFixed(1) + "×" : "") : "") +
      '</div><p>' + story + '</p></div>' +
    '<div class="why"><div class="lbl">Why</div><p>' + d.explanation + '</p>' +
      '<p class="src">' + esc(d.module) + ' — <a href="' + d.url + '" target="_blank" rel="noopener">read the guide</a></p></div>' +
    '<button class="btn wide" id="onward">' + (last ? "See how it ended" : "Carry on") + '</button>';

  state.veil.querySelector("#onward").addEventListener("click", onward);
  state.veil.querySelector("#out").focus();
  countUp(document.getElementById("score"), state.points, 600);
}

function onward() {
  var last = state.decision.i === TOTAL - 1;
  state.decision = null;
  state.veil = null;
  state.gained = null;
  if (last) { state.screen = "end"; return render(); }
  state.loc += 1;
  state.dialog = { lines: [{ text: here().intro, raw: true }], idx: 0 };
  render();
}

/* ── ending ───────────────────────────────────────────────────── */

function computeBadges() {
  var at = {}, seq = [];
  state.log.forEach(function (e) { at[e.i] = e.right; seq.push(e.right); });
  var ctx = {
    at: at, correct: state.correct, evidence: state.evidence,
    held: function (id) { return !!state.found[id]; }
  };
  return BADGES.map(function (b) { return { badge: b, earned: !!b.test(ctx) }; });
}

function renderEnd() {
  var ending = ENDINGS.filter(function (r) { return state.correct >= r.min; })[0];
  var badges = computeBadges();
  var prev = state.hadBest;
  var isBest = saveBest({ points: state.points, correct: state.correct, evidence: state.evidence, streak: state.bestStreak });
  var missed = state.log.filter(function (e) { return !e.right; });

  var html = '<div class="frame">' +
    '<div class="stage"><svg viewBox="0 0 800 400" role="img" aria-label="Your desk, later">' + artDesk(true) + '</svg></div>' +
    '<div class="endwrap"><div style="text-align:center">' +
      '<p class="eyebrow">How it ended</p>' +
      '<div class="rank-name">' + esc(ending.name) + '</div>' +
      '<p class="epilogue">' + ending.text + '</p>' +
      '<div class="big"><span id="pts">0</span> <span>/ ' + MAX_POINTS.toLocaleString() + ' pts</span></div>' +
      '<div class="tallies">' +
        '<div class="tally"><b>' + state.correct + ' / ' + TOTAL + '</b>decisions right</div>' +
        '<div class="tally"><b>' + state.evidence + ' / ' + EVIDENCE_TOTAL + '</b>evidence found</div>' +
        '<div class="tally"><b>' + state.bestStreak + '</b>longest streak</div>' +
      '</div>' +
      (isBest && prev ? '<p class="best">⭐ New best — you beat ' + prev.points.toLocaleString() + ' pts</p>'
        : isBest ? '<p class="best">⭐ Best run saved</p>'
        : prev ? '<p class="best">Your best: ' + prev.points.toLocaleString() + ' pts</p>' : "") +
    '</div>';

  html += '<p class="eyebrow" style="margin-top:1.4rem">Badges</p><div class="badges">';
  badges.forEach(function (b) {
    html += '<div class="badge"' + (b.earned ? ' data-earn="1"' : "") + '>' +
      '<div class="ico">' + b.badge.ico + '</div><div class="nm">' + esc(b.badge.name) + '</div>' +
      '<div class="ds">' + esc(b.badge.desc) + '</div></div>';
  });
  html += '</div>';

  if (missed.length) {
    var mods = [];
    missed.forEach(function (e) {
      var m = DECISIONS[e.i].module;
      if (mods.indexOf(m) === -1) mods.push(m);
    });
    var first = DECISIONS[missed[0].i];
    html += '<div class="nudge"><b>Where the story turned:</b> ' + esc(mods.slice(0, 2).join(" and ")) +
      '. Start with <a href="' + first.url + '" target="_blank" rel="noopener">' + esc(first.module) + '</a>, then play it again — ' +
      'the options are reshuffled every run, so position will not save you.</div>';
  } else if (state.evidence < EVIDENCE_TOTAL) {
    html += '<div class="nudge"><b>Eight for eight.</b> You still left ' + (EVIDENCE_TOTAL - state.evidence) +
      ' piece' + (EVIDENCE_TOTAL - state.evidence === 1 ? "" : "s") + ' of evidence unexamined — ' +
      'right answers you did not fully earn. Go back and turn over the rest.</div>';
  } else {
    html += '<div class="nudge"><b>Nothing left in this building.</b> The real test is the next thing you build: take one initiative ' +
      'already in flight and run it through Five Whys, then the 4Cs, then a leading and lagging chain.</div>';
  }

  html += '<p class="eyebrow">Every decision</p><div class="review">';
  state.log.forEach(function (e, n) {
    var d = DECISIONS[e.i];
    html += '<div class="row"><div class="q"><span class="mark ' + (e.right ? "ok" : "no") + '">' +
      (e.right ? "✓" : "✗") + '</span>' + (n + 1) + ". " + esc(d.ask) + '</div>' +
      '<div class="a">You chose: <b>' + esc(d.options[e.picked]) + '</b>' +
      (e.right ? "" : '<br>The answer: <b>' + esc(d.options[d.answer]) + '</b>') + '</div></div>';
  });
  html += '</div><div class="actions"><button class="btn" id="again">Play again</button>' +
    '<a class="btn ghost" href="https://www.idg.gov.sg/product-thinking/" target="_blank" rel="noopener">Read the source</a>' +
    '</div></div></div>';

  app.innerHTML = html;
  countUp(document.getElementById("pts"), state.points, 900);

  var earned = app.querySelectorAll('.badge[data-earn="1"]');
  var step = reduced() ? 0 : 150;
  for (var i = 0; i < earned.length; i++) {
    (function (n, k) { setTimeout(function () { n.classList.add("earned"); }, 350 + k * step); })(earned[i], i);
  }
  var again = document.getElementById("again");
  again.addEventListener("click", start);
  again.focus();
}

/* ── keyboard ─────────────────────────────────────────────────── */

document.addEventListener("keydown", function (ev) {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

  if (state.decision && !state.decision.answered && ev.key >= "1" && ev.key <= "4") {
    var opts = state.veil ? state.veil.querySelectorAll(".opt") : [];
    var i = parseInt(ev.key, 10) - 1;
    if (opts[i]) { ev.preventDefault(); answer(i); }
    return;
  }
  if (ev.key === "Enter") {
    if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
    var next = document.getElementById("onward") || document.getElementById("cont") ||
               document.getElementById("actnow") || document.getElementById("go") ||
               document.getElementById("again");
    if (next) { ev.preventDefault(); next.click(); }
  }
});

reset();
render();

</script>
</body>
</html>
